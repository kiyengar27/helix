name: Staging enrollment plan or deployment
run-name: "Staging enrollment · ${{ inputs.operation == 'deploy' && 'DEPLOY · Apply reviewed plan (writes allowed)' || 'PLAN · Validate only (no resource writes)' }} · @${{ github.actor }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan first; deploy requires the reviewed successful plan run ID
        required: true
        default: plan
        type: choice
        options: [plan, deploy]
      plan_run_id:
        description: For deploy only — successful PLAN run ID for this same main commit
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: helix-staging
  cancel-in-progress: false
jobs:
  staging:
    name: ${{ inputs.operation == 'deploy' && 'Approve enrollment deployment — synthetic patient writes' || 'Approve enrollment validation — no resource writes' }}
    if: github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true' && vars.ENROLLMENT_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: make build
      - name: Check reviewed plan run provenance
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          node --input-type=module <<'NODE'
          const id=process.env.PLAN_RUN_ID;
          if(!/^[0-9]+$/.test(id??''))throw new Error('A successful reviewed PLAN run ID is required');
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw new Error('Cannot read reviewed plan run');
          const run=await response.json();
          if(run.head_sha!==process.env.GITHUB_SHA||run.head_branch!=='main'||run.event!=='workflow_dispatch'||run.conclusion!=='success'||run.path!=='.github/workflows/enrollment.yml'||!run.display_title.includes('PLAN · Validate only'))throw new Error('Plan must be a successful main PLAN run from this workflow and same commit');
          NODE
      - name: Download reviewed plan
        if: inputs.operation == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: enrollment-plan-${{ inputs.plan_run_id }}
          path: code/reviewed
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Validate and save plan
        if: inputs.operation == 'plan'
        env:
          MEDPLUM_ENROLLMENT_CLIENT_ID: ${{ secrets.MEDPLUM_ENROLLMENT_CLIENT_ID }}
          MEDPLUM_ENROLLMENT_CLIENT_SECRET: ${{ secrets.MEDPLUM_ENROLLMENT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p reports
          npm run plan:enrollment -- --out reports/plan.json 2>&1 | tee reports/plan.log
      - name: Apply reviewed plan and verify
        if: inputs.operation == 'deploy'
        env:
          MEDPLUM_ENROLLMENT_CLIENT_ID: ${{ secrets.MEDPLUM_ENROLLMENT_CLIENT_ID }}
          MEDPLUM_ENROLLMENT_CLIENT_SECRET: ${{ secrets.MEDPLUM_ENROLLMENT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p reports
          npm run apply:enrollment -- --plan-file reviewed/plan.json 2>&1 | tee reports/apply.log
      - name: Upload successful reviewable plan
        if: success() && inputs.operation == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: enrollment-plan-${{ github.run_id }}
          path: code/reports/plan.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrollment-evidence-${{ github.sha }}-${{ github.run_id }}
          path: code/reports/
          retention-days: 14
