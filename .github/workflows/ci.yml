name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: make build
      - name: Render compiled care-delivery preview
        run: mkdir -p reports && npm --silent run preview > reports/care-delivery-preview.json
      - uses: actions/upload-artifact@v4
        with:
          name: care-delivery-preview-${{ github.sha }}
          path: code/reports/care-delivery-preview.json
          retention-days: 14
